<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Site Bot · 网站生成机器人</title>
<style>
  :root {
    --bg: #F6F6F4; --panel: #FFFFFF; --ink: #1C1917; --ink-2: #57534E;
    --ink-3: #A8A29E; --line: #E7E5E4; --accent: #6D28D9; --accent-soft: #EDE9FE;
    --ok: #15803D; --err: #B91C1C; --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  }

  /* 顶栏 */
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .brand small { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 2px; }
  .spacer { flex: 1; }

  .status {
    font-size: 12px; color: var(--ink-2); padding: 5px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); display: none;
  }
  .status.error { color: var(--err); }

  /* 主体 */
  main { flex: 1; display: flex; min-height: 0; }

  /* 聊天区 */
  .chat-col { width: 46%; min-width: 380px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); position: relative; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; max-width: 92%; }
  .msg.user { align-self: flex-end; }
  .msg .bubble {
    padding: 10px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble { background: var(--bg); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-top-right-radius: 4px; }
  .msg .bubble.error { border-color: #FECACA; background: #FEF2F2; color: var(--err); }
  .msg .example {
    display: inline-block; margin-top: 6px; padding: 6px 10px;
    background: var(--accent-soft); color: var(--accent); border-radius: 8px; font-size: 13px;
  }

  .card { max-width: 100%; }
  .card.typing {
    display: flex; gap: 5px; padding: 14px 16px;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); width: fit-content;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

  .card.brief, .card.design, .card.steps, .card.gen {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; font-size: 13.5px; width: fit-content; max-width: 100%;
    box-shadow: 0 1px 3px rgba(28,25,23,.05);
  }
  .card-title { font-weight: 700; margin-bottom: 10px; font-size: 14px; }
  .kv { display: flex; gap: 8px; margin: 4px 0; }
  .kv > span:first-child { color: var(--ink-3); min-width: 56px; flex-shrink: 0; }
  .note { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.6; }

  /* 设计令牌 */
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .token {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; font-size: 12px;
  }
  .token i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.1); }

  /* 步骤 */
  .step { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .step .si {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    background: var(--line); color: var(--ink-3);
  }
  .step.active { font-weight: 600; }
  .step.active .si { background: var(--accent); color: #fff; }
  .step.done .si { background: var(--ok); color: #fff; }
  .step.done { color: var(--ink-3); text-decoration: line-through; }

  /* 生成卡片 */
  .gen-status { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .gen-count { font-weight: 700; color: var(--accent); }
  .gen-code {
    max-height: 160px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font-family: var(--mono); font-size: 11px;
    color: var(--ink-2); white-space: pre-wrap; word-break: break-all;
  }

  /* 输入区 */
  .input-row { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  #input {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
    font-size: 14px; outline: none; resize: none; min-height: 44px; font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  .hbtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 9px; padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .hbtn:hover { border-color: var(--accent); color: var(--accent); }
  .hbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hbtn.primary:hover { opacity: .9; }
  .hbtn:disabled { opacity: .4; cursor: not-allowed; }

  /* 预览区 */
  .preview-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .preview-toolbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .tab {
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid transparent; color: var(--ink-2);
  }
  .tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .toolbar-btn {
    padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn:disabled { opacity: .4; cursor: not-allowed; }

  .preview-body { flex: 1; display: flex; min-height: 0; flex-direction: column; }
  #previewFrame {
    flex: 1; width: 100%; border: none; background: #fff; min-height: 0;
  }
  #codeView {
    flex: 1; width: 100%; border: none; background: var(--panel); font-family: var(--mono);
    font-size: 12px; line-height: 1.5; padding: 16px; overflow: auto; display: none; resize: none;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">🤖</div>
    <div>Hello Site Bot<small>网站生成</small></div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn" id="newBtn" title="新对话">➕ 新对话</button>
  <button class="hbtn" id="keyBtn" title="API Key 管理">🔑 API Key</button>
</header>

<div id="keyPanel" style="display:none; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-direction:column; gap:8px;">
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <label style="font-size:12px; color:var(--ink-2); min-width:72px;"><b>DeepSeek</b> <span id="deepseekKeyStatus" style="font-size:12px; color:var(--ink-3);"></span></label>
    <input id="deepseekKeyInput" type="password" placeholder="粘贴 DeepSeek API Key（sk-...）" style="flex:1; min-width:200px; max-width:420px; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px;" />
    <button class="hbtn primary" id="deepseekSaveBtn">保存</button>
    <button class="hbtn" id="deepseekTestBtn">测试</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <label style="font-size:12px; color:var(--ink-2); min-width:72px;"><b>Agnes</b> <span id="agnesKeyStatus" style="font-size:12px; color:var(--ink-3);"></span></label>
    <input id="agnesKeyInput" type="password" placeholder="粘贴 Agnes API Key（sk-...）" style="flex:1; min-width:200px; max-width:420px; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px;" />
    <button class="hbtn primary" id="agnesSaveBtn">保存</button>
    <button class="hbtn" id="agnesTestBtn">测试</button>
  </div>
</div>

<div class="status" id="statusBar"></div>

<main>
  <!-- 左：聊天 -->
  <div class="chat-col">
    <div id="chat"></div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="描述你想要的网站，比如「帮我做一个咖啡店官网」…"></textarea>
      <button class="hbtn primary" id="sendBtn" title="发送">发送</button>
      <button class="hbtn" id="stopBtn" style="display:none" title="停止">■</button>
    </div>
  </div>

  <!-- 右：预览 -->
  <div class="preview-col">
    <div class="preview-toolbar">
      <div class="tab active" id="tabPreview">预览</div>
      <div class="tab" id="tabCode">代码</div>
      <div style="flex:1"></div>
      <button class="toolbar-btn" id="qaBtn" disabled>🔍 自检</button>
      <button class="toolbar-btn" id="downloadBtn" disabled>⬇ 下载</button>
      <button class="toolbar-btn" id="openBtn" disabled>🔗 新窗</button>
      <button class="toolbar-btn" id="copyBtn" disabled>复制代码</button>
    </div>
    <div class="preview-body">
      <iframe id="previewFrame" title="网站预览"></iframe>
      <textarea id="codeView" readonly rows="20"></textarea>
    </div>
  </div>
</main>

<script src="app.js?v=2"></script>
</body>
</html>
